# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-slim

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - run: python --version
    - run: echo "code deployed successfully"

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run tests with mochawesome reporter
      run: npm run test:report
      continue-on-error: true

    - name: Generate test summary
      if: always()
      run: |
        if [ -f reports/test-report.json ]; then
          echo "# Test Report Summary" > reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          TOTAL=$(jq '.stats.tests' reports/test-report.json)
          PASSES=$(jq '.stats.passes' reports/test-report.json)
          FAILURES=$(jq '.stats.failures' reports/test-report.json)
          DURATION=$(jq '.stats.duration' reports/test-report.json)
          echo "**Total Tests:** $TOTAL" >> reports/SUMMARY.md
          echo "**Passed:** $PASSES ✅" >> reports/SUMMARY.md
          echo "**Failed:** $FAILURES ❌" >> reports/SUMMARY.md
          echo "**Duration:** ${DURATION}ms" >> reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          echo "[View Full HTML Report](test-report.html)" >> reports/SUMMARY.md
        fi

    - name: Upload test reports as artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: reports/
        retention-days: 30
        if-no-files-found: warn
